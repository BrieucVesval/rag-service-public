  # ---------------------------------------------------------------- batch 3: multi-hop
  # Answers combine several fiches, or several cases of one fiche.
  - id: q021
    question: "Je loue un bureau dans un immeuble en copropriété à Paris et j'aimerais le transformer en logement pour y habiter. Quelles démarches dois-je faire ?"
    category: multi_hop
    split: dev
    expected_answer: >-
      Plusieurs démarches se cumulent. Urbanisme : c'est un changement de destination, soumis à
      déclaration préalable s'il n'y a pas de modification de façade ni de structure (permis de
      construire sinon) ; à Paris, le dossier se dépose au Bureau accueil et service à l'usager
      (Basu), uniquement en ligne. Location : il faut l'autorisation écrite du propriétaire.
      Copropriété : si le règlement ne permet pas cette destination, il faut une autorisation de
      l'assemblée générale, votée à l'unanimité. Impôts : déclarer le changement (formulaire IL)
      dans les 90 jours, et une taxe d'aménagement est due.
    key_facts:
      - "Déclaration préalable si pas de modification de façade ou de structure (sinon permis de construire)"
      - "À Paris, dossier au Basu uniquement par voie dématérialisée"
      - "Autorisation écrite du propriétaire pour un locataire"
      - "Autorisation de l'AG à l'unanimité si le règlement de copropriété l'impose"
      - "Déclaration aux impôts dans les 90 jours"
    expected_docs: [F2416, F35336]
    evidence:
      - doc_id: F2416
        quote: "Un changement de destination sans modification de la façade ou de la structure porteuse est soumis à DP."
      - doc_id: F2416
        quote: "Vous devez remplir et transmettre votre dossier au Bureau accueil et service à l'usager (Basu) uniquement par voie dématérialisée"
      - doc_id: F2416
        quote: "vous devez obtenir l'autorisation écrite du propriétaire pour transformer votre local professionnel ou commercial en habitation"
      - doc_id: F2416
        quote: "La décision est prise à l'unanimité de l'ensemble des copropriétaires."
      - doc_id: F2416
        quote: "dans les 90 jours de la réalisation du changement de destination"
      - doc_id: F35336
        quote: "Si vous devez compenser, vous pouvez, par exemple, transformer un local commercial, professionnel ou un bureau en habitation."
    origin: drafted_reviewed
    notes: >-
      Derived from the v0 failure (2026-10-09): the model claimed Paris had no compensation
      requirement and confused "changement d'usage" with "changement de destination".
      Turning an office into housing is itself a way to compensate, not something that needs one.

  - id: q022
    question: "J'ai percé des trous de cheville pour accrocher des étagères. Mon propriétaire peut-il garder une partie de ma caution pour ça quand je pars ?"
    category: multi_hop
    split: dev
    expected_answer: >-
      Reboucher les trous faits par exemple pour poser des tableaux ou des miroirs fait partie des
      réparations locatives à la charge du locataire. S'il ne le fait pas, le propriétaire peut
      déduire les frais du dépôt de garantie, à condition de s'appuyer sur les états des lieux
      d'entrée et de sortie et de justifier les sommes (devis, factures). Si l'état des lieux de
      sortie n'est pas conforme à celui d'entrée, il a 2 mois au maximum pour rendre le solde.
    key_facts:
