# Golden set: fixed evaluation questions for the RAG pipeline.
#
# Rules (see docs/project_log.md, step 6):
# - Questions are phrased as a real user would ask them, never by copying the fiche title.
# - Every key fact is backed by a verbatim `evidence` quote (checked by
#   scripts/validate_golden_set.py against the processed corpus).
# - `test` questions are never looked at while tuning the pipeline.
# - Reference answers are valid for `corpus_snapshot`; the feed changes daily.

corpus_snapshot: "2026-10-07T16:35:15+00:00"

